# App Store 價格爬蟲
# 觸發方式：
#   1. 每日排程（03:00 台北時間）— 更新 registry 內全部 app
#   2. 手動 workflow_dispatch — 可指定單一 app id 與國家
#   3. 開 issue，標題格式「[crawl] <app id 或 App Store 連結>」（限 repo 擁有者）
name: crawl

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: 'App ID（留空＝依 registry 抓全部）'
        required: false
      countries:
        description: '國碼（逗號分隔，留空＝registry 預設）'
        required: false
  schedule:
    - cron: '0 19 * * *' # 19:00 UTC = 03:00 台北
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, '[crawl]') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # issue 標題/內文屬外部輸入：只經環境變數傳遞，由腳本嚴格萃取，防止注入
      - name: Determine crawl targets
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_APP_ID: ${{ inputs.app_id }}
          INPUT_COUNTRIES: ${{ inputs.countries }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/extract-target.mjs

      - name: Crawl prices
        env:
          APP_ID: ${{ steps.targets.outputs.app_id }}
          COUNTRIES: ${{ steps.targets.outputs.countries }}
        run: |
          ARGS=""
          if [ -n "$APP_ID" ]; then ARGS="$ARGS --apps $APP_ID"; fi
          if [ -n "$COUNTRIES" ]; then ARGS="$ARGS --countries $COUNTRIES"; fi
          node scripts/crawl.mjs $ARGS

      - name: Commit snapshots
        id: commit
        run: |
          git config user.name "appprize-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有變更"
          else
            git commit -m "chore(data): 更新價格快照"
            for i in 1 2 3; do
              git pull --rebase origin "$GITHUB_REF_NAME" || true
              if git push origin "HEAD:$GITHUB_REF_NAME"; then break; fi
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reply and close issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APP_ID: ${{ steps.targets.outputs.app_id }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ -n "$APP_ID" ]; then
            BODY="已抓取 App ${APP_ID} 的最新價格（快照更新：${CHANGED}）。回到 AppPrize 按「更新價格」即可看到新資料。"
          else
            BODY="沒有在 issue 中找到有效的 App ID，請以「[crawl] id6448311069」或貼上 App Store 連結的格式再開一次。"
          fi
          printf '%s\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n' "$BODY" > /tmp/body.md
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/body.md
          gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY"
